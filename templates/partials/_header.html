<header class="sticky top-0 z-30 h-16 bg-white/85 backdrop-blur border-b border-slate-200/80 flex items-center gap-3 px-4 sm:px-6">
  <button type="button" data-action="open-rail" class="lg:hidden p-2 -ml-1 rounded-lg hover:bg-slate-100"><i data-lucide="menu" class="text-[20px]"></i></button>
  <button type="button" data-action="collapse-rail" class="hidden lg:grid place-items-center w-9 h-9 rounded-lg hover:bg-slate-100 text-ink-mute"><i data-lucide="panel-left" class="text-[18px]"></i></button>

  <nav class="min-w-0 flex-1" aria-label="Breadcrumb">
    <div id="crumb" class="text-[13.5px] font-medium text-ink-soft truncate">{{ crumb }}</div>
  </nav>

  <div class="hidden md:flex items-center gap-2 w-[340px] px-3 h-9 rounded-xl bg-slate-100/80 border border-transparent focus-within:bg-white focus-within:border-accent-500/40 focus-within:ring-4 focus-within:ring-accent-500/10 transition">
    <i data-lucide="search" class="text-[16px] text-ink-faint"></i>
    <input placeholder="Search jobs, content, assets…" class="bg-transparent text-[13px] w-full outline-none placeholder:text-ink-faint">
    <kbd class="text-[10px] text-ink-faint border border-slate-300 rounded px-1.5 py-0.5">⌘K</kbd>
  </div>
  <button type="button" class="md:hidden p-2 rounded-lg hover:bg-slate-100"><i data-lucide="search" class="text-[19px]"></i></button>

  <button type="button" data-action="open-drawer" class="relative p-2 rounded-lg hover:bg-slate-100" aria-label="Notifications">
    <i data-lucide="bell" class="text-[19px]"></i>
    <span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-err-500 ring-2 ring-white"></span>
  </button>
  <button type="button" class="hidden sm:grid place-items-center w-9 h-9 rounded-lg hover:bg-slate-100"><i data-lucide="circle-help" class="text-[19px]"></i></button>
  {% if current_user %}
    <div class="w-9 h-9 rounded-full bg-primary-500 grid place-items-center text-white text-[12px] font-semibold shrink-0"
         title="{{ current_user.username }}">{{ current_user.initials }}</div>
  {% endif %}
</header>
